configs:
  cm:
    exec.enabled: false
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
  params:
    server.insecure: true
repoServer:
  replicas: 1
  extraContainers:
    - name: cmp-ksops
      image: viaductoss/ksops:v4.5.1
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-ksops
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        - name: cmp-tmp
          mountPath: /tmp
        - name: sops-age
          mountPath: /home/argocd/.config/sops/age
          readOnly: true
  volumes:
    - name: cmp-ksops
      configMap:
        name: argocd-cmp-ksops
    - name: cmp-tmp
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: argocd-sops-age
server:
  replicas: 1
  service:
    type: ClusterIP
