apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-prerequisites
  namespace: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  sources:
    - repoURL: https://charts.min.io/
      chart: minio
      targetRevision: 5.4.0
      helm:
        valueFiles:
          - $values/environments/current/overlays/data-prerequisites/minio-values.yaml
    - repoURL: https://github.com/charleschen68/big-data-platform-envs.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 1.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
