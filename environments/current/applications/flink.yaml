apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink
  namespace: gitops
spec:
  project: platform
  source:
    repoURL: https://github.com/charleschen68/big-data-platform-envs.git
    targetRevision: feat/gitops-data-collectors
    path: environments/current/overlays/flink
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
