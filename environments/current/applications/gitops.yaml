apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-self
  namespace: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ad/big-data-platform-envs.git
    targetRevision: HEAD
    path: environments/current
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
