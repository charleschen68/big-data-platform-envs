apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-secrets
  namespace: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: platform
  source:
    repoURL: https://github.com/charleschen68/big-data-platform-envs.git
    targetRevision: feat/gitops-data-collectors
    path: environments/current/flink-secrets
    plugin:
      name: ksops
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
