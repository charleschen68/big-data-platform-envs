apiVersion: batch/v1
kind: Job
metadata:
  name: milvus-schema-init
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: milvus-schema-init
          image: big-data/milvus-schema-init:phase2
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: collector-config
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retrain
spec:
  schedule: "0 3 * * 0"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: model-retrain
              image: big-data/model-retrain:git-6a41c69
              imagePullPolicy: Never
              envFrom:
                - configMapRef:
                    name: collector-config
              resources:
                requests: {cpu: 200m, memory: 256Mi}
                limits: {cpu: "2", memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: artifacts, mountPath: /artifacts}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: collector-artifacts
            - name: tmp
              emptyDir: {}
